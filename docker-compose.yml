# Luna, locally: postgres, the Go services behind nginx, and mail.
#
#   cp .env.example .env            # then fill in the secrets (see the file)
#   docker compose build            # GITHUB_TOKEN in .env or the shell
#   docker compose up -d
#
# Only nginx (80/443), postgres (127.0.0.1:5433, for `gtr dev`) and mail
# publish ports. The services talk over luna-net: luna-auth checks API keys
# against luna-dashboard's internal API, the dashboard manages users through
# luna-auth's; luna-pages and luna-files check keys the same way; nginx exposes
# no /internal/. luna-files keeps the bytes in the files-data volume unless
# FILES_STORAGE=s3 (Spaces) is set in .env.

x-app-build: &app-build
  context: .
  dockerfile: docker/app.Dockerfile
  secrets:
    - github_token

x-dashboard-env: &dashboard-env
  APP_NAME: luna-dashboard
  APP_ENV: ${APP_ENV:-local}
  APP_URL: https://${DASHBOARD_DOMAIN:-dashboard.luna.local}
  HTTP_ADDR: ":8080"
  HTTP_TRUSTED_PROXIES: private
  API_DOCS: "true"
  DB_DRIVER: postgres
  DATABASE_DSN: postgres://dashboard_user:${DASHBOARD_DB_PASSWORD:-dashboard_password}@postgres:5432/dashboard?sslmode=require
  LUNA_SERVICE_TOKENS: ${LUNA_SERVICE_TOKEN:?set LUNA_SERVICE_TOKEN in .env (luna-cli key:generate --name LUNA_SERVICE_TOKEN)}
  # The users pages call luna-auth's internal API with the same token.
  LUNA_AUTH_URL: http://luna-auth:8080
  LUNA_AUTH_TOKEN: ${LUNA_SERVICE_TOKEN}
  # The site editor calls luna-pages' internal API, with the same token.
  LUNA_PAGES_URL: http://luna-pages:8080
  # A developer's session; a refresh token renews it while they work (2h away
  # signs them out, 30 days with Remember me: DASHBOARD_REFRESH_TTL, DASHBOARD_REMEMBER_TTL).
  AUTH_SESSION_TTL: 30m
  LUNA_PAGES_TOKEN: ${LUNA_SERVICE_TOKEN}
  # The file browser and the editor's assets call luna-files' internal API.
  LUNA_FILES_URL: http://luna-files:8080
  LUNA_FILES_TOKEN: ${LUNA_SERVICE_TOKEN}

x-auth-env: &auth-env
  APP_NAME: luna-auth
  APP_ENV: ${APP_ENV:-local}
  APP_URL: https://${AUTH_DOMAIN:-auth.luna.local}
  HTTP_ADDR: ":8080"
  HTTP_TRUSTED_PROXIES: private
  API_DOCS: "true"
  DB_DRIVER: postgres
  DATABASE_DSN: postgres://auth_service:${AUTH_DB_PASSWORD:-auth_password}@postgres:5432/auth_db?sslmode=require
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (luna-cli key:generate)}
  LUNA_DASHBOARD_URL: http://luna-dashboard:8080
  LUNA_DASHBOARD_TOKEN: ${LUNA_SERVICE_TOKEN:?set LUNA_SERVICE_TOKEN in .env}
  MAIL_HOST: ${AUTH_MAIL_HOST:-}
  MAIL_PORT: ${AUTH_MAIL_PORT:-587}
  MAIL_USERNAME: ${AUTH_MAIL_USERNAME:-}
  MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD:-}
  MAIL_FROM: ${AUTH_MAIL_FROM:-Luna <no-reply@luna.local>}

x-pages-env: &pages-env
  APP_NAME: luna-pages
  APP_ENV: ${APP_ENV:-local}
  APP_URL: https://${PAGES_DOMAIN:-pages.luna.local}
  HTTP_ADDR: ":8080"
  HTTP_TRUSTED_PROXIES: private
  API_DOCS: "true"
  DB_DRIVER: postgres
  DATABASE_DSN: postgres://pages_service:${PAGES_DB_PASSWORD:-pages_password}@postgres:5432/pages_db?sslmode=require
  LUNA_DASHBOARD_URL: http://luna-dashboard:8080
  LUNA_DASHBOARD_TOKEN: ${LUNA_SERVICE_TOKEN:?set LUNA_SERVICE_TOKEN in .env}

x-files-env: &files-env
  APP_NAME: luna-files
  APP_ENV: ${APP_ENV:-local}
  APP_URL: https://${FILES_DOMAIN:-files.luna.local}
  HTTP_ADDR: ":8080"
  HTTP_TRUSTED_PROXIES: private
  API_DOCS: "true"
  DB_DRIVER: postgres
  DATABASE_DSN: postgres://files_service:${FILES_DB_PASSWORD:-files_password}@postgres:5432/files_db?sslmode=require
  LUNA_DASHBOARD_URL: http://luna-dashboard:8080
  LUNA_DASHBOARD_TOKEN: ${LUNA_SERVICE_TOKEN:?set LUNA_SERVICE_TOKEN in .env}
  # disk: the files-data volume, served at /blobs/ with signed links; s3:
  # DigitalOcean Spaces (FILES_S3_* and FILES_PUBLIC_URL in .env).
  FILES_STORAGE: ${FILES_STORAGE:-disk}
  FILES_DISK_ROOT: /data/files
  FILES_DISK_URL: https://${FILES_DOMAIN:-files.luna.local}/blobs
  FILES_DISK_SECRET: ${FILES_DISK_SECRET:-${LUNA_SERVICE_TOKEN}}
  FILES_S3_ENDPOINT: ${FILES_S3_ENDPOINT:-}
  FILES_S3_REGION: ${FILES_S3_REGION:-us-east-1}
  FILES_S3_BUCKET: ${FILES_S3_BUCKET:-}
  FILES_S3_KEY: ${FILES_S3_KEY:-}
  FILES_S3_SECRET: ${FILES_S3_SECRET:-}
  FILES_PUBLIC_URL: ${FILES_PUBLIC_URL:-}
  FILES_QUOTA: ${FILES_QUOTA:-1GiB}
  FILES_KEEP_VERSIONS: ${FILES_KEEP_VERSIONS:-10}
  FILES_CDN_ENDPOINT_ID: ${FILES_CDN_ENDPOINT_ID:-}
  FILES_DO_TOKEN: ${FILES_DO_TOKEN:-}

x-db-passwords: &db-passwords
  AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
  DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-dashboard_password}
  PAGES_DB_PASSWORD: ${PAGES_DB_PASSWORD:-pages_password}
  FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:-files_password}

services:
  certbot-init:
    image: alpine:3.20
    entrypoint: /init-dummy-certs.sh
    restart: "no"
    volumes:
      - ./certbot/init-dummy-certs.sh:/init-dummy-certs.sh:ro
      - certbot_conf:/etc/letsencrypt
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.luna.local}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-dashboard.luna.local}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.luna.local}
    networks:
      - luna-net

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: luna-postgres:18
    container_name: luna-postgres
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/generate-tls.sh && exec /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      # The superuser: applies when the data volume is created. The service
      # roles and databases are (re)made by postgres-init on every up.
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      <<: *db-passwords
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/var/lib/postgresql/tls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - luna-net

  # One-shot: the services' roles and databases (10-luna.sh, idempotent), so a
  # new service gets its database on an existing volume too.
  postgres-init:
    image: luna-postgres:18
    pull_policy: never
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/10-luna.sh"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      PGHOST: postgres
      PGSSLMODE: require
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      <<: *db-passwords
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - luna-net

  # One-shot: applies pending migrations, then exits; the service waits for it.
  luna-dashboard-migrate:
    # The luna-dashboard service's image (built once, below).
    image: luna-dashboard:local
    pull_policy: never
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment: *dashboard-env
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - luna-net

  luna-dashboard:
    build:
      <<: *app-build
      args:
        SERVICE: luna-dashboard
    image: luna-dashboard:local
    container_name: luna-dashboard
    restart: unless-stopped
    environment: *dashboard-env
    depends_on:
      postgres:
        condition: service_healthy
      luna-dashboard-migrate:
        condition: service_completed_successfully
    networks:
      - luna-net

  luna-auth-migrate:
    image: luna-auth:local
    pull_policy: never
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment: *auth-env
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - luna-net

  luna-auth:
    build:
      <<: *app-build
      args:
        SERVICE: luna-auth
    image: luna-auth:local
    container_name: luna-auth
    restart: unless-stopped
    environment: *auth-env
    depends_on:
      luna-auth-migrate:
        condition: service_completed_successfully
      luna-dashboard:
        condition: service_healthy
    networks:
      - luna-net

  luna-pages-migrate:
    image: luna-pages:local
    pull_policy: never
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment: *pages-env
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - luna-net

  luna-pages:
    build:
      <<: *app-build
      args:
        SERVICE: luna-pages
    image: luna-pages:local
    container_name: luna-pages
    restart: unless-stopped
    environment: *pages-env
    depends_on:
      luna-pages-migrate:
        condition: service_completed_successfully
      luna-dashboard:
        condition: service_healthy
    networks:
      - luna-net

  luna-files-migrate:
    image: luna-files:local
    pull_policy: never
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment: *files-env
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - luna-net

  # One-shot: the files volume belongs to the image's non-root user.
  luna-files-volume:
    image: alpine:3.20
    command: ["chown", "65532:65532", "/data/files"]
    restart: "no"
    volumes:
      - files-data:/data/files

  luna-files:
    build:
      <<: *app-build
      args:
        SERVICE: luna-files
    image: luna-files:local
    container_name: luna-files
    restart: unless-stopped
    environment: *files-env
    volumes:
      - files-data:/data/files
    depends_on:
      luna-files-migrate:
        condition: service_completed_successfully
      luna-files-volume:
        condition: service_completed_successfully
      luna-dashboard:
        condition: service_healthy
    networks:
      - luna-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: luna-nginx:local
    container_name: luna-nginx
    restart: unless-stopped
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      luna-auth:
        condition: service_healthy
      luna-dashboard:
        condition: service_healthy
      luna-pages:
        condition: service_healthy
      luna-files:
        condition: service_healthy
    volumes:
      - ./nginx/sites:/etc/nginx/sites-available
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    networks:
      - luna-net

  mail:
    depends_on:
      - certbot-init
    build:
      context: ./mail
    restart: unless-stopped
    hostname: mail.${MAIL_DOMAIN:-mail.luna.local}
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN:-mail.luna.local}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    volumes:
      - mail_data:/var/mail/vhosts
      - certbot_conf:/etc/letsencrypt:ro
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    networks:
      - luna-net

  roundcube:
    image: roundcube/roundcubemail:latest
    restart: unless-stopped
    depends_on:
      - mail
    ports:
      - "8081:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail
      ROUNDCUBEMAIL_DEFAULT_PORT: 993

      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail
      ROUNDCUBEMAIL_SMTP_PORT: 587

      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
      ROUNDCUBEMAIL_DB_TYPE: sqlite

      ROUNDCUBEMAIL_CONFIG_DEFAULTS: |
        $$config['imap_conn_options'] = [
          'ssl' => [
            'verify_peer' => false,
            'verify_peer_name' => false,
            'allow_self_signed' => true,
          ],
        ];

        $$config['smtp_conn_options'] = [
          'ssl' => [
            'verify_peer' => false,
            'verify_peer_name' => false,
            'allow_self_signed' => true,
          ],
        ];

    volumes:
      - roundcube_data:/var/roundcube
      - ./roundcube/config.inc.php:/var/www/html/config/config.inc.php:ro
    networks:
      - luna-net

# The service images fetch packages through the GitHub API while building;
# a token (any, read-only public access is enough) lifts the anonymous limit.
secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  postgres-data:
  files-data:
  postgres-tls:
  mail_data:
  certbot_conf:
  certbot_www:
  roundcube_data:

networks:
  luna-net:
    driver: bridge
