services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: luna-postgres:latest
    container_name: luna-postgres
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "/usr/local/bin/generate-tls.sh && exec /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/var/lib/postgresql/tls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - luna-net

  luna-auth:
    build:
      context: ./luna-auth
      dockerfile: Dockerfile
    image: luna-auth:latest
    container_name: luna-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: auth_service
      DB_PASSWORD: auth_password
      DB_SSLMODE: require
      DB_SSLROOTCERT: /etc/postgresql/tls/ca.crt
      SECRET_KEY: super-secret-key
    volumes:
      - postgres-tls:/etc/postgresql/tls:ro
    ports:
      - "8000:8000"
    networks:
      - luna-net

  luna-dashboard:
    build:
      context: ./luna-dashboard
      dockerfile: Dockerfile
    image: luna-dashboard:latest
    container_name: luna-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dashboard_user:dashboard_password@postgres:5432/dashboard?schema=public&sslmode=require&sslrootcert=/etc/postgresql/tls/ca.crt
      PORT: 3000
    volumes:
      - postgres-tls:/etc/postgresql/tls:ro
    ports:
      - "3000:3000"
    networks:
      - luna-net

volumes:
  postgres-data:
  postgres-tls:

networks:
  luna-net:
    driver: bridge
