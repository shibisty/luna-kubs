# luna-files: the file storage of client applications (API keys); with
# FILES_STORAGE=disk also the files themselves at /blobs/.
server {
    listen 80;
    listen [::]:80;
    server_name files.luna.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name files.luna.local;

    # startup.sh creates a self-signed default.crt in nginx/ssl on first start.
    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    # API uploads are at most 10 MiB; presigned uploads to /blobs/ up to 5 GiB.
    client_max_body_size 11m;

    # The dashboard's file browser API, for luna-net only.
    location /internal/ {
        return 404;
    }

    location /blobs/ {
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_pass http://luna-files:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The services trust these only from private networks (HTTP_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://luna-files:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The services trust these only from private networks (HTTP_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    error_log /var/log/nginx/files_error.log;
    access_log /var/log/nginx/files_access.log;
}
