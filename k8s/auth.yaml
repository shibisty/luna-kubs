apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: auth
spec:
  selector:
    app: auth
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: auth:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-db-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-secrets
                  key: DB_PASSWORD
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_SSLMODE
            - name: DB_SSLROOTCERT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_SSLROOTCERT
            - name: DB_SSLCERT
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_SSLCERT
            - name: DB_SSLKEY
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: DB_SSLKEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: SECRET_KEY
          volumeMounts:
            - name: postgres-tls
              mountPath: /etc/postgresql/tls
              readOnly: true
      volumes:
        - name: postgres-tls
          secret:
            secretName: postgres-tls
