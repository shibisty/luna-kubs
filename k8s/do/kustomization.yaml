# Luna on DigitalOcean Kubernetes. Once (see README.md): cert-manager, the
# registry integration, settings.env, secrets.env, cloudflare.env. Then:
#
#   kubectl apply -k k8s/do
#
# Images come from your DigitalOcean Container Registry, all in one
# repository (<registry>/luna) and told apart by tag: <service>-<version>, as
# k8s\do\push.bat pushes them. Set the registry name and the versions below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: luna
labels:
  - pairs:
      app.kubernetes.io/part-of: luna
resources:
  - ../base
  - cert-manager.yaml
  - nginx.yaml
  - mail.yaml
  - roundcube.yaml

images:
  - name: luna-dashboard
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "dashboard-0.5.1"
  - name: luna-auth
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "auth-0.1.0"
  - name: luna-pages
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "pages-0.3.0"
  - name: luna-files
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "files-0.1.0"
  - name: luna-forms
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "forms-0.1.0"
  - name: luna-nginx
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "nginx-0.1.1"
  - name: luna-postgres
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "postgres-18"
  - name: luna-mail
    newName: registry.digitalocean.com/lunaregistry/luna
    newTag: "mail-0.1.0"

configMapGenerator:
  - name: luna-config
    behavior: merge
    literals:
      - APP_ENV=production
      - API_DOCS=true
  # The public names (settings.env): nginx renders its sites from them, the
  # replacements below put them into the certificate and the services' URLs.
  - name: luna-settings
    envs:
      - settings.env
  - name: nginx-templates
    files:
      - nginx/redirect.conf.template
      - nginx/auth.conf.template
      - nginx/dashboard.conf.template
      - nginx/pages.conf.template
      - nginx/files.conf.template
      - nginx/forms.conf.template
      - nginx/webmail.conf.template
      - nginx/gtr.conf.template
  - name: roundcube-config
    files:
      - roundcube/config.inc.php

secretGenerator:
  - name: luna-secrets
    envs:
      - secrets.env
  # Referenced by the Issuers by name (kustomize does not rewrite
  # cert-manager's references), so no hash suffix.
  - name: cloudflare-dns
    envs:
      - cloudflare.env
    options:
      disableNameSuffixHash: true

patches:
  # Pull from the registry: the secret the DigitalOcean registry integration
  # creates in every namespace is named after the registry.
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: lunaregistry}]
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: lunaregistry}]
  # roundcube comes from Docker Hub: no registry secret needed, but harmless.
  # Production storage and size.
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  # luna-auth sends password reset emails through luna-mail's submission port.
  - target: {kind: Deployment, name: luna-auth}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: luna-auth
      spec:
        template:
          spec:
            containers:
              - name: luna-auth
                env:
                  - name: MAIL_HOST
                    valueFrom:
                      configMapKeyRef: {name: luna-settings, key: MAIL_HOST}
                  - name: MAIL_PORT
                    value: "587"
                  - name: MAIL_USERNAME
                    valueFrom:
                      configMapKeyRef: {name: luna-settings, key: AUTH_MAIL_USERNAME}
                  - name: MAIL_PASSWORD
                    valueFrom:
                      secretKeyRef: {name: luna-secrets, key: MAIL_PASSWORD}
                  - name: MAIL_FROM
                    valueFrom:
                      configMapKeyRef: {name: luna-settings, key: AUTH_MAIL_FROM}

  # luna-files keeps the bytes in Spaces (settings.env, secrets.env).
  - target: {kind: Deployment, name: luna-files}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: luna-files
      spec:
        template:
          spec:
            containers:
              - name: luna-files
                env: &filesEnv
                  - {name: FILES_S3_ENDPOINT, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_S3_ENDPOINT}}}
                  - {name: FILES_S3_REGION, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_S3_REGION}}}
                  - {name: FILES_S3_BUCKET, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_S3_BUCKET}}}
                  - {name: FILES_PUBLIC_URL, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_PUBLIC_URL}}}
                  - {name: FILES_QUOTA, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_QUOTA}}}
                  - {name: FILES_KEEP_VERSIONS, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_KEEP_VERSIONS, optional: true}}}
                  - {name: FILES_CDN_ENDPOINT_ID, valueFrom: {configMapKeyRef: {name: luna-settings, key: FILES_CDN_ENDPOINT_ID, optional: true}}}
                  - {name: FILES_S3_KEY, valueFrom: {secretKeyRef: {name: luna-secrets, key: FILES_S3_KEY}}}
                  - {name: FILES_S3_SECRET, valueFrom: {secretKeyRef: {name: luna-secrets, key: FILES_S3_SECRET}}}
                  - {name: FILES_DO_TOKEN, valueFrom: {secretKeyRef: {name: luna-secrets, key: FILES_DO_TOKEN, optional: true}}}
            initContainers:
              - name: migrate
                env: *filesEnv

replacements:
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.LETSENCRYPT_EMAIL}
    targets:
      - select: {kind: Issuer}
        fieldPaths: [spec.acme.email]
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.AUTH_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.0]
      - select: {kind: Deployment, name: luna-auth}
        fieldPaths:
          - spec.template.spec.containers.[name=luna-auth].env.[name=APP_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=APP_URL].value
        options: {delimiter: "//", index: 1}
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.DASHBOARD_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.1]
      - select: {kind: Deployment, name: luna-dashboard}
        fieldPaths:
          - spec.template.spec.containers.[name=luna-dashboard].env.[name=APP_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=APP_URL].value
        options: {delimiter: "//", index: 1}
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.WEBMAIL_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.2]
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.MAIL_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.3]
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.PAGES_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.4]
      - select: {kind: Deployment, name: luna-pages}
        fieldPaths:
          - spec.template.spec.containers.[name=luna-pages].env.[name=APP_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=APP_URL].value
        options: {delimiter: "//", index: 1}
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.FILES_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.5]
      - select: {kind: Deployment, name: luna-files}
        fieldPaths:
          - spec.template.spec.containers.[name=luna-files].env.[name=APP_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=APP_URL].value
        options: {delimiter: "//", index: 1}
  # The gtr registry (a Luna client application in namespace gtr, served
  # through this edge): its host in the certificate.
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.GTR_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.6]
  # luna-forms: its own address, and where the published pages post their
  # forms and load runtime.js from.
  - source: {kind: ConfigMap, name: luna-settings, fieldPath: data.FORMS_HOST}
    targets:
      - select: {kind: Certificate, name: luna-tls}
        fieldPaths: [spec.dnsNames.7]
      - select: {kind: Deployment, name: luna-forms}
        fieldPaths:
          - spec.template.spec.containers.[name=luna-forms].env.[name=APP_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=APP_URL].value
          - spec.template.spec.containers.[name=luna-forms].env.[name=FORMS_PUBLIC_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=FORMS_PUBLIC_URL].value
        options: {delimiter: "//", index: 1}
      - select: {kind: Deployment, name: luna-pages}
        fieldPaths:
          - spec.template.spec.containers.[name=luna-pages].env.[name=PAGES_FORMS_URL].value
          - spec.template.spec.initContainers.[name=migrate].env.[name=PAGES_FORMS_URL].value
        options: {delimiter: "//", index: 1}
