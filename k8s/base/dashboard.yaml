# Developer console and key authority. Its /internal/ API is for luna-auth.
apiVersion: v1
kind: Service
metadata:
  name: luna-dashboard
spec:
  selector:
    app: luna-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luna-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: luna-dashboard
  template:
    metadata:
      labels:
        app: luna-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Pending migrations first; the server starts only when they succeed.
        - name: migrate
          image: luna-dashboard:local
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom: &envFrom
            - configMapRef: {name: luna-config}
          env: &env
            - name: APP_NAME
              value: luna-dashboard
            - name: APP_URL
              value: https://dashboard.luna.local
            - name: AUTH_SESSION_TTL
              value: 30m
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: luna-secrets, key: DASHBOARD_DB_PASSWORD}
            - name: DATABASE_DSN
              value: "postgres://dashboard_user:$(DB_PASSWORD)@postgres:5432/dashboard?sslmode=require"
            - name: LUNA_SERVICE_TOKENS
              valueFrom:
                secretKeyRef: {name: luna-secrets, key: LUNA_SERVICE_TOKEN}
            - name: LUNA_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: luna-secrets, key: LUNA_SERVICE_TOKEN}
            - name: LUNA_PAGES_TOKEN
              valueFrom:
                secretKeyRef: {name: luna-secrets, key: LUNA_SERVICE_TOKEN}
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: luna-dashboard
          image: luna-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom: *envFrom
          env: *env
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext: *containerSecurity
