# The CMS of client applications (layouts, templates, pages), behind API keys.
apiVersion: v1
kind: Service
metadata:
  name: luna-pages
spec:
  selector:
    app: luna-pages
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luna-pages
spec:
  replicas: 1
  selector:
    matchLabels:
      app: luna-pages
  template:
    metadata:
      labels:
        app: luna-pages
    spec:
      securityContext:
        runAsNonRoot: true
        # distroless' nonroot user by number: the image names it (USER nonroot),
        # which the kubelet cannot check against runAsNonRoot.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Pending migrations first; the server starts only when they succeed.
        - name: migrate
          image: luna-pages:local
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom: &envFrom
            - configMapRef: {name: luna-config}
          env: &env
            - name: APP_NAME
              value: luna-pages
            - name: APP_URL
              value: https://pages.luna.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: luna-secrets, key: PAGES_DB_PASSWORD}
            - name: DATABASE_DSN
              value: "postgres://pages_service:$(DB_PASSWORD)@postgres:5432/pages_db?sslmode=require"
            - name: LUNA_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef: {name: luna-secrets, key: LUNA_SERVICE_TOKEN}
            # Published forms post to luna-forms and load its runtime.js.
            - name: PAGES_FORMS_URL
              value: https://forms.luna.local
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: luna-pages
          image: luna-pages:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom: *envFrom
          env: *env
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext: *containerSecurity
