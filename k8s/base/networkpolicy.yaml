# Who may talk to whom (enforced only by a CNI with NetworkPolicy support,
# e.g. `minikube start --cni=calico`; ignored otherwise).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: luna-dashboard}}
        - podSelector: {matchLabels: {app: luna-auth}}
        - podSelector: {matchLabels: {app: luna-pages}}
        - podSelector: {matchLabels: {app: luna-files}}
        - podSelector: {matchLabels: {app: luna-forms}}
      ports:
        - port: 5432
---
# The dashboard: nginx (the console), luna-auth, luna-pages, luna-files and luna-forms (key introspection).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: luna-dashboard
spec:
  podSelector:
    matchLabels: {app: luna-dashboard}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: luna-nginx}}
        - podSelector: {matchLabels: {app: luna-auth}}
        - podSelector: {matchLabels: {app: luna-pages}}
        - podSelector: {matchLabels: {app: luna-files}}
        - podSelector: {matchLabels: {app: luna-forms}}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: luna-auth
spec:
  podSelector:
    matchLabels: {app: luna-auth}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # nginx (the public API) and the dashboard (the internal API).
        - podSelector: {matchLabels: {app: luna-nginx}}
        - podSelector: {matchLabels: {app: luna-dashboard}}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: luna-pages
spec:
  podSelector:
    matchLabels: {app: luna-pages}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # nginx (the public API) and the dashboard (the internal editor API).
        - podSelector: {matchLabels: {app: luna-nginx}}
        - podSelector: {matchLabels: {app: luna-dashboard}}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: luna-files
spec:
  podSelector:
    matchLabels: {app: luna-files}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # nginx (the public API), the dashboard (the internal file API) and
        # luna-forms (the files of submissions).
        - podSelector: {matchLabels: {app: luna-nginx}}
        - podSelector: {matchLabels: {app: luna-dashboard}}
        - podSelector: {matchLabels: {app: luna-forms}}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: luna-forms
spec:
  podSelector:
    matchLabels: {app: luna-forms}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # nginx (the sites' submissions, the public API) and the dashboard
        # (the internal forms API).
        - podSelector: {matchLabels: {app: luna-nginx}}
        - podSelector: {matchLabels: {app: luna-dashboard}}
      ports:
        - port: 8080
