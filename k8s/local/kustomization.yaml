# Luna on minikube:
#
#   cp k8s/local/secrets.env.example k8s/local/secrets.env   # fill in, see the file
#   kubectl apply -k k8s/local
#
# Images are the ones docker compose builds (luna-*:local); load them into
# the cluster first, see ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: luna
labels:
  - pairs:
      app.kubernetes.io/part-of: luna
resources:
  - ../base
  - nginx.yaml
  - files-volume.yaml
configMapGenerator:
  - name: luna-config
    behavior: merge
    literals:
      - APP_ENV=local
      - API_DOCS=true
      # luna-files keeps the bytes on a volume (no Spaces on minikube).
      - FILES_STORAGE=disk
      - FILES_DISK_ROOT=/data/files
      - FILES_DISK_URL=https://files.luna.local/blobs
  - name: nginx-sites
    files:
      - nginx/auth.luna.conf
      - nginx/dashboard.luna.conf
      - nginx/pages.luna.conf
      - nginx/files.luna.conf
secretGenerator:
  - name: luna-secrets
    envs:
      - secrets.env
patches:
  # luna-files keeps the bytes on a volume, signs its links with the service token.
  - target: {kind: Deployment, name: luna-files}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: luna-files
      spec:
        strategy: {type: Recreate}
        template:
          spec:
            securityContext:
              fsGroup: 65532
            volumes:
              - name: files
                persistentVolumeClaim: {claimName: luna-files}
            containers:
              - name: luna-files
                volumeMounts:
                  - {name: files, mountPath: /data/files}
                env:
                  - {name: FILES_DISK_SECRET, valueFrom: {secretKeyRef: {name: luna-secrets, key: LUNA_SERVICE_TOKEN}}}
            initContainers:
              - name: migrate
                env:
                  - {name: FILES_DISK_SECRET, valueFrom: {secretKeyRef: {name: luna-secrets, key: LUNA_SERVICE_TOKEN}}}
