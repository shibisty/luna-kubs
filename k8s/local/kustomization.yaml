# Luna on minikube:
#
#   cp k8s/local/secrets.env.example k8s/local/secrets.env   # fill in, see the file
#   kubectl apply -k k8s/local
#
# Images are the ones docker compose builds (luna-*:local); load them into
# the cluster first, see ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: luna
labels:
  - pairs:
      app.kubernetes.io/part-of: luna
resources:
  - ../base
  - nginx.yaml
configMapGenerator:
  - name: luna-config
    behavior: merge
    literals:
      - APP_ENV=local
      - API_DOCS=true
  - name: nginx-sites
    files:
      - nginx/auth.luna.conf
      - nginx/dashboard.luna.conf
secretGenerator:
  - name: luna-secrets
    envs:
      - secrets.env
