# Kept in step with nginx/sites/ (kustomize reads files only below k8s/local/).
# luna-dashboard: the developer console. Its /internal/ API (key
# introspection, its docs) is for luna-auth over luna-net only.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.luna.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.luna.local;

    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    client_max_body_size 11m; # the page editor's projects (4 MiB), uploads to luna-files (10 MiB)

    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://luna-dashboard:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    error_log /var/log/nginx/dashboard_error.log;
    access_log /var/log/nginx/dashboard_access.log;
}
