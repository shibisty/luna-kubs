# Kept in step with nginx/sites/ (kustomize reads files only below k8s/local/).
# luna-forms: what visitors send through the sites' forms (public, CORS *),
# runtime.js for the published pages, and the forms API (API keys).
server {
    listen 80;
    listen [::]:80;
    server_name forms.luna.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forms.luna.local;

    # startup.sh creates a self-signed default.crt in nginx/ssl on first start.
    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    # Submissions with files: FORMS_MAX_UPLOAD (25 MiB) and the form fields.
    client_max_body_size 26m;

    # The dashboard's API, for luna-net only.
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://luna-forms:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The services trust these only from private networks (HTTP_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    error_log /var/log/nginx/forms_error.log;
    access_log /var/log/nginx/forms_access.log;
}
