# Kept in step with nginx/sites/ (kustomize reads files only below k8s/local/).
# luna-auth: the public API of client applications (API keys, end users).
server {
    listen 80;
    listen [::]:80;
    server_name auth.luna.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.luna.local;

    # startup.sh creates a self-signed default.crt in nginx/ssl on first start.
    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    client_max_body_size 1m;

    # The dashboard's administration API, for luna-net only.
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://luna-auth:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The services trust these only from private networks (HTTP_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    error_log /var/log/nginx/auth_error.log;
    access_log /var/log/nginx/auth_access.log;
}
