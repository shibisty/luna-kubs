# The edge: TLS (a self-signed default.crt that startup.sh creates in the
# emptyDir) and the two hosts. `minikube tunnel` gives the Service an address.
apiVersion: v1
kind: Service
metadata:
  name: luna-nginx
spec:
  type: LoadBalancer
  selector:
    app: luna-nginx
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luna-nginx
spec:
  replicas: 1
  # The host ports are free only once the old pod is gone.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: luna-nginx
  template:
    metadata:
      labels:
        app: luna-nginx
    spec:
      containers:
        - name: nginx
          image: luna-nginx:local
          imagePullPolicy: IfNotPresent
          ports:
            # Also on the minikube VM's own ports 80 and 443: point the hosts
            # file at `minikube ip` and no tunnel or port-forward is needed
            # (luna.ps1 start writes it).
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: sites
              mountPath: /etc/nginx/sites-available
              readOnly: true
            - name: ssl
              mountPath: /etc/nginx/ssl
      volumes:
        - name: sites
          configMap:
            name: nginx-sites
        - name: ssl
          emptyDir: {}
