apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: auth
type: Opaque
stringData:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secrets
  namespace: auth
type: Opaque
stringData:
  DB_NAME: auth_db
  DB_USER: auth_service
  DB_PASSWORD: auth_password
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: auth
type: Opaque
stringData:
  SECRET_KEY: super-secret-key
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-tls
  namespace: auth
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    YOUR_SERVER_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    YOUR_SERVER_PRIVATE_KEY
    -----END PRIVATE KEY-----
