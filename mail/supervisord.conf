[program:postfix]
command=/bin/sh -c "postfix start-fg"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dovecot]
command=/usr/sbin/dovecot -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cert-reloader]
; certbot обновляет файлы на shared-volume, но postfix/dovecot держат сертификат
; в памяти с момента старта — раз в 12 часов подсовываем им команду reload.
command=/bin/sh -c "while :; do sleep 12h; postfix reload; doveadm reload; done"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
